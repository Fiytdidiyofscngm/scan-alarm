tasks.matching { it.name != 'makeIcon' && (it.name == 'preBuild' || it.name.endsWith('Resources')) }.configureEach { dependsOn 'makeIcon' }
android {
    namespace 'com.wakeup.scanalarm'
    compileSdk 34

    sourceSets {
        main {
            res.srcDir iconRes.get().asFile
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'com.wakeup.scanalarm'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
