plugins {
    id 'com.android.application' version '8.5.2'
}


// Space alarm icon: these files are created at build time, so no folders are needed in the repository.
def iconRes = layout.buildDirectory.dir('generated/icon/res')

tasks.register('makeIcon') {
    def out = iconRes.get().asFile
    outputs.dir(out)
    doLast {
        new File(out, 'mipmap-anydpi-v26').mkdirs()
        new File(out, 'drawable').mkdirs()
        new File(out, 'mipmap-anydpi-v26/ic_launcher.xml').text = '''<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@drawable/ic_bg"/>
    <foreground android:drawable="@drawable/ic_fg"/>
</adaptive-icon>'''
        new File(out, 'drawable/ic_bg.xml').text = '''<?xml version="1.0" encoding="utf-8"?>
